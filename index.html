
<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Plano de Corte - Web App</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1fadad",
                        "primary-hover": "#178a8a",
                        "background-light": "#f9fafa",
                        "background-dark": "#121717",
                        "surface-dark": "#1d2626",
                        "border-dark": "#2a3737",
                        "input-border": "#3d5151",
                        "text-muted": "#9fb7b7",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, #2a3737 1px, transparent 1px), linear-gradient(to bottom, #2a3737 1px, transparent 1px)",
                    }
                },
            },
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #121717; }
        ::-webkit-scrollbar-thumb { background: #2a3737; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3d5151; }
        .grid-bg {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(42, 55, 55, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(42, 55, 55, 0.5) 1px, transparent 1px);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-background-dark text-white font-display h-screen flex flex-col overflow-hidden">
    <div id="root"></div>
</body>
</html>
