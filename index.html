
<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="description" content="Ferramenta profissional para otimização de planos de corte de bobinas PPF, Insulfilm e Vinil."/>
    <title>Plano de Corte Pro</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary":          "#1fadad",
                        "primary-hover":    "#178a8a",
                        "background-dark":  "#111616",
                        "surface-dark":     "#1a2323",
                        "border-dark":      "#253030",
                        "input-border":     "#374848",
                        "text-muted":       "#8aabab",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                    },
                },
            },
        }
    </script>

    <style>
        /* ── Scrollbar ── */
        ::-webkit-scrollbar             { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track       { background: #111616; }
        ::-webkit-scrollbar-thumb       { background: #253030; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #374848; }

        /* ── Grid background for canvas ── */
        .grid-bg {
            background-color: #111616;
            background-image:
                linear-gradient(to right,  rgba(37, 48, 48, 0.6) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(37, 48, 48, 0.6) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* ── Smooth number input arrows hidden ── */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { opacity: 0.4; }

        /* ── Focus ring ── */
        :focus-visible { outline: 2px solid rgba(31,173,173,0.5); outline-offset: 2px; }

        /* ── Subtle glow pulse on the generate button ── */
        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 4px 16px rgba(31,173,173,0.35); }
            50%       { box-shadow: 0 4px 22px rgba(31,173,173,0.55); }
        }
        .btn-generate { animation: glow-pulse 3s ease-in-out infinite; }
        .btn-generate:hover { animation: none; }

        /* ── Piece fade-in ── */
        @keyframes piece-in {
            from { opacity: 0; transform: scale(0.92); }
            to   { opacity: 1; transform: scale(1); }
        }
        .piece-anim { animation: piece-in 0.18s ease-out both; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react/":     "https://esm.sh/react@^19.2.3/",
        "react":      "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>
</head>
<body class="bg-background-dark text-white font-display h-screen flex flex-col overflow-hidden antialiased">
    <div id="root"></div>
</body>
</html>
